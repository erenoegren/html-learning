<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting</title>
</head>
<body>
    <p>This is a simple paragraph.</p>
    <p>Bu <b>Kalin</b> metin.</p>
    <p>Bu <i>Italik</i> metin.</p>
    <p>Bu <big>Buyuk</big> metin.</p>
    <p>Bu <small>Kucuk</small> metin.</p>
    <p>Bu <sub>Alt</sub> metin.</p>
    <p>Bu <sup>Ust</sup> metin.</p>
    <p>Bu <mark>Isaretli</mark> metin.</p>
    <p>Bu <del>Silinmis</del> metin.</p>
    <p>Bu <ins>Eklenmis</ins> metin.</p>
</body>
</html>
